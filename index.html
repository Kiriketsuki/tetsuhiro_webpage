    <title>Jovian Lim</title>
    <!--
      The gate: a paper lantern on an autumn branch under the night sky. It lives here, not in the app bundle, so it paints before the JS arrives and
      costs nothing against the shell budgets. The lantern, the branch and the leaves are frames
      from lab/gate-lantern.html, drawn with the aerie's own toon material, ink and lens, so they
      match the aerie. Kinako stays out of the gate for now and walks only in the aerie.
      - The first paint shows the whole picture at once: a small soft copy of it (.ga-first) sits under the sharp layers. The script at the end of the
        body fades the sharp layers in once their files decode, so no layer pops in alone.
      - The lamp lights and autumn spreads along the branch as the load grows: the ga-dawn animations creep from the first paint, then
        src/components/gate-meter.js plays the load share on the same layers.
      - When the visitor goes in, the lamp light washes the view into the aerie, and Name.vue
        hides the art. The nav lantern brings it back.
      Every motion here, the meter too, is a transform or an opacity, so the
      compositor keeps it smooth while the main thread builds the scene. Colours are hex, and
      the fonts are named here, because the token CSS loads with the bundle and does not hold
      up the first paint.
    -->
    <style>
      :root {
        --font-display: "Instrument Serif", Georgia, serif;
        --font-label: "JetBrains Mono", ui-monospace, monospace;
      }
      #gate-art {
        position: fixed;
        inset: 0;
        z-index: 59;
        overflow: hidden;
        background:
          radial-gradient(120% 60% at 50% 108%, #3a2a5a 0, #23234a 30%, transparent 62%),
          radial-gradient(80% 50% at 82% 8%, #10244a, transparent 70%),
          linear-gradient(#020812, #071330 45%, #141a3c 78%, #2a2148);
      }
      #gate-art.is-open {
        opacity: 0;
        transition: opacity 1s 0.9s;
      }
      #gate-art > *,
      .ga-art > * {
        position: absolute;
      }
      .ga-star {
        left: 0;
        top: 0;
        width: 2px;
        height: 2px;
        border-radius: 50%;
        animation: ga-twinkle 4s ease-in-out infinite;
      }
      .ga-star.b {
        animation-delay: -2s;
      }
      .ga-star.far {
        width: 1px;
        height: 1px;
        animation: none;
      }
      .ga-moon {
        right: 13%;
        top: 11%;
        width: 3.2rem;
        height: 3.2rem;
        border-radius: 50%;
        background: radial-gradient(circle at 38% 38%, #f6fbff, #d8ebfb 55%, #a9c3dd);
        box-shadow: 0 0 2rem 0.6rem #d8ebfb40, 0 0 8rem 3rem #8fb6e01c;
      }
      .ga-sky {
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .ga-clouds {
        animation: ga-drift 60s linear infinite alternate;
      }
      .ga-islets {
        animation: ga-bob 9s ease-in-out infinite alternate;
      }
      /* The frames keep a 1024 by 784 shape. The lantern hook sits at 50% 21.5%, the middle of the
         paper at 50% 55.9%. */
      .ga-art {
        left: 50%;
        top: 56%;
        width: min(38rem, 120vw, 58vh);
        aspect-ratio: 1024 / 784;
        transform: translate(-50%, -50%);
        perspective: 40rem;
      }
      .ga-img,
      .ga-layer,
      .ga-first {
        position: absolute;
        inset: 0;
        background: center / 100% 100% no-repeat;
      }

      }
      #gate-art.is-sharp .ga-first {
        opacity: 0;
        transition: opacity 0s 0.6s;
      }
      /* The sharp layers fade in over the soft copy when their files decode: the unlit set at
         once (is-sharp), then the lit lamp (is-lamp) and the autumn branch (is-autumn) each on
         its own. On a slow line a lit layer can arrive with the meter well along, so it fades in
         slowly and the lamp warms up instead of jumping. The script at the end of the body sets
         the flags. */
      .ga-sharp,
      .ga-lamp,
      .ga-autumn-in {
        opacity: 0;
        transition: opacity 0.5s;
      }
      .ga-lamp,
      .ga-autumn-in {
        transition-duration: 1.2s;
      }
      #gate-art.is-sharp .ga-sharp,
      #gate-art.is-lamp .ga-lamp,
      #gate-art.is-autumn .ga-autumn-in {
        opacity: 1;
      }
      /* The night grows darker at the top and the bottom, so the title and the way in read. */
      .ga-scrim {
        inset: 0;
        background: linear-gradient(#020812cc, transparent 32% 64%, #020812dd);
        pointer-events: none;
      }
      /* Each layer takes its file only once the script at the end of the body has loaded and
         decoded it. A background image on a painted element loads at the first paint, even at
         opacity 0, and on slow 3G these files then shared the line with the app bundle. */
      #gate-art.is-sharp .ga-branch {
        background-image: url(/gate/branch-s0.webp);
      }
      #gate-art.is-sharp .ga-paper {
        background-image: url(/gate/lantern-s0.webp);
      }
      #gate-art.is-lamp .ga-lit {
        background-image: url(/gate/lantern-s1.webp);
      }
      #gate-art.is-autumn .ga-autumn {
        background-image: url(/gate/branch-s1.webp);
      }
      #gate-art.has-leaves .ga-leaf,
      #gate-art.has-leaves .ga-drift {
        background-image: url(/gate/sprites-s1.webp);
      }
      /* Autumn spreads along the branch from left to right as the load grows. Four copies of
         the autumn branch lie over the green one, and none of them moves. Each copy has a fixed
         mask with a soft right edge that reaches further than the last, and the last copy has
         no mask. Name.vue fades the copies in one after the other, so the autumn front sweeps
         right with a soft edge. A sliding window with the branch sliding back inside it drifted
         apart in Firefox on a busy main thread and showed a second branch. Strips with hard
         edges showed bands. */
      .ga-reveal {
        position: absolute;
        inset: 0;
      }
      .ga-autumn {
        opacity: 0;
      }
      .ga-autumn.a0 {
        -webkit-mask: linear-gradient(90deg, #000 10%, transparent 45%);
        mask: linear-gradient(90deg, #000 10%, transparent 45%);
        animation: ga-dawn-autumn 24s linear forwards;
      }
      .ga-autumn.a1 {
        -webkit-mask: linear-gradient(90deg, #000 35%, transparent 70%);
        mask: linear-gradient(90deg, #000 35%, transparent 70%);
      }
      .ga-autumn.a2 {
        -webkit-mask: linear-gradient(90deg, #000 60%, transparent 95%);
        mask: linear-gradient(90deg, #000 60%, transparent 95%);
      }
      /* Name.vue swings .ga-nudge on a hover or a tap. At rest the lantern and the branch hold
         still: a turned layer is resampled on every frame, and that softens the ribs and the
         paper grain. The idle life comes from the glow, the sky and the drifting leaves. */
      .ga-nudge,
      .ga-lantern {
        position: absolute;
        inset: 0;
        transform-origin: 50% 21.5%;
      }
      /* The lantern layers are a tight crop at a finer scale than the branch, so the lantern,
         the sharp middle of the picture, keeps its ribs crisp. scripts/gate-matte.py prints
         this box. */
      .ga-paper {
        inset: auto;
        left: 37.38%;
        top: 20.51%;
        width: 25.23%;
        height: 74.08%;
      }
      .ga-lit {
        opacity: 0;
        animation: ga-dawn-lit 24s linear forwards;
      }
      .ga-glow {
        left: 50%;
        top: 55.9%;
        width: 78%;
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        opacity: 0;
        animation: ga-dawn-lit 24s linear forwards;
      }
      .ga-glow::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(closest-side, #ffb04d55, #ff8a3a1f 45%, transparent);
        animation: ga-flicker 3.1s ease-in-out infinite;
      }
      .ga-flare,
      .ga-bloom {
        left: 50%;
        top: 55.9%;
        width: 52%;
        aspect-ratio: 1;
        border-radius: 50%;
        opacity: 0;
        transform: translate(-50%, -50%);
        will-change: transform, opacity;
      }
      .ga-flare {
        background: radial-gradient(closest-side, #ffe2a088, #ffb04d33 45%, transparent);
      }
      .ga-bloom {
        background: radial-gradient(closest-side, #ffd28a, #ffb04dcc 35%, #ff8a3a55 60%, transparent);
      }
      .is-open .ga-bloom {
        animation: ga-bloom 1.5s cubic-bezier(0.35, 0, 0.6, 1) forwards;
      }
      .ga-leaf {
        left: var(--x);
        top: var(--y);
        width: 6.5%;
        aspect-ratio: 1;
        background: calc(var(--s) * 33.333%) 0 / 400% 100% no-repeat;
        opacity: 0;
      }
      /* Once the lamp is lit, a leaf now and then lets go of the branch and drifts down. */
      .ga-drift {
        left: var(--x);
        top: var(--y);
        width: 6.5%;
        aspect-ratio: 1;
        background: calc(var(--s) * 33.333%) 0 / 400% 100% no-repeat;
        opacity: 0;
      }
      .is-lit .ga-drift {
        animation: ga-drift var(--t) linear var(--d) infinite;
      }
      .is-open .ga-drift {
        display: none;
      }
      .is-open .ga-leaf {
        animation: ga-fall 3.6s cubic-bezier(0.4, 0, 0.7, 1) var(--d) both;
      }
      .is-open .ga-fades {
        opacity: 0;
        transition: opacity 1.2s 0.5s;
      }
      /* The dawn: before the bundle arrives, the lamp warms to share 0.16 on its own, slower
         and slower. gate-meter.js reads these keyframes and goes on from the value they show,
         so they stay linear pieces, one set per layer at the same shares. */
      @keyframes ga-dawn-lit {
        0% { opacity: 0; }
        8% { opacity: 0.05; }
        20% { opacity: 0.09; }
        40% { opacity: 0.12; }
        70% { opacity: 0.15; }
        100% { opacity: 0.16; }
      }
      /* The first autumn copy at the dawn shares. It fades in over shares 0 to 0.3, and the
         other copies start past the dawn. */
      @keyframes ga-dawn-autumn {
        0% { opacity: 0; }
        8% { opacity: 0.167; }
        20% { opacity: 0.3; }
        40% { opacity: 0.4; }
        70% { opacity: 0.5; }
        100% { opacity: 0.533; }
      }
      @keyframes ga-twinkle {
        50% { opacity: 0.25; }
      }
      @keyframes ga-drift {
        to { transform: translateX(-4%); }
      }
      @keyframes ga-bob {
        to { transform: translateY(-6px); }
      }
      @keyframes ga-flicker {
        30% { opacity: 0.84; transform: scale(0.985); }
        55% { opacity: 1; }
        80% { opacity: 0.9; transform: scale(1.012); }
      }
      @keyframes ga-drift {
        0%, 62% { opacity: 0; transform: translate(0, 0) rotate(var(--r)) rotateX(0deg); }
        66%, 92% { opacity: 1; }
        100% { opacity: 0; transform: translate(-1.5rem, 60vh) rotate(calc(var(--r) + 200deg)) rotateX(480deg); }
      }
      @keyframes ga-bloom {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
        35% { opacity: 1; }
        100% { opacity: 1; transform: translate(-50%, -50%) scale(9); }
      }
      @keyframes ga-fall {
        0% { opacity: 1; transform: translate(0, 0) rotate(var(--r)) rotateX(0deg); }
        40% { transform: translate(1.6rem, 22vh) rotate(calc(var(--r) + 80deg)) rotateX(200deg); }
        85% { opacity: 1; }
        100% { opacity: 0; transform: translate(-1.2rem, 70vh) rotate(calc(var(--r) + 200deg)) rotateX(520deg); }
      }
      @media (max-aspect-ratio: 1/1) {
        .ga-moon {
          right: 10%;
          top: 9%;
          width: 2.4rem;
          height: 2.4rem;
        }
        .ga-art {
          top: 52%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #gate-art * {
          animation: none !important;
        }
        #gate-art *::before {
          animation: none !important;
        }
        #gate-art .ga-title {
          transition: none !important;
        }
        #gate-art.is-open {
          transition: opacity 0.6s;
        }
      }
      /* The gate dialog from Name.vue: a title screen lit from below by the lantern. */
      .gate {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: clamp(2.5rem, 9vh, 5.5rem) 1.5rem clamp(2rem, 7vh, 4rem);
        text-align: center;
      }
      .gate > * {
        position: relative;
      }
      /* Name.vue places this over the lantern. A hover or a tap swings it. */
      .gate > .gate-lantern {
        position: absolute;
        border-radius: 45%;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .gate-lantern:focus-visible {
        outline: 2px solid #fcc96a;
        outline-offset: 4px;
      }
      /* The title paints with the art, before the bundle (.ga-title). The dialog in Name.vue
         keeps its own copy for screen readers, unseen, so its layout and its name stay. */
      .ga-title {
        top: clamp(2.5rem, 9vh, 5.5rem);
        right: 1.5rem;
        left: 1.5rem;
        text-align: center;
        transform-origin: 50% 0;
        transition: transform 1.6s cubic-bezier(0.6, 0, 0.3, 1);
      }
      .ga-heading {
        position: relative;
        display: block;
      }
      .gate > .gate-title {
        opacity: 0;
      }
      /* Every line in the gate has a set height, so a font that arrives late changes no layout. */
      .gate-eyebrow,
      .gate-role {
        display: block;
        font-family: var(--font-label);
        font-size: 0.72rem;
        line-height: 1rem;
        text-transform: uppercase;
      }
      .gate-eyebrow {
        padding-left: 0.42em;
        letter-spacing: 0.42em;
        color: #e8c089;
      }
      .gate-name {
        display: block;
        margin-top: 0.5rem;
        font-family: var(--font-display);
        font-size: clamp(3.2rem, min(8vw, 11vh), 7rem);
        font-weight: 400;
        line-height: 0.9;
        padding: 0 0.15em 0.1em;
        color: #c9a46a;
      }
      /* The lit name lies over the unlit one, and the gate meter fades it in with the lamp. Each
         is one flat colour (docs/design-system.md). */
      #gate-name {
        margin: 0;
        font: inherit;
      }
      .gate-name.is-lit {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        margin: 0;
        color: #f2d9a6;
        opacity: 0;
      }
      .gate-role {
        margin-top: 0.9rem;
        padding-left: 0.3em;
        letter-spacing: 0.3em;
        color: #beb2a1;
      }
      .gate-role::after {
        content: '';
        display: block;
        width: 3rem;
        height: 1px;
        margin: 1rem auto 0;
        background: #e8c08966;
      }
      .gate-foot {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.1rem;
      }
      /* The count and the lit line share one cell, so the swap at ready moves nothing. */
      .gate-readout {
        display: grid;
        justify-items: center;
        align-items: center;
        max-width: 22rem;
        height: 1.6rem;
        line-height: 1.6rem;
        font-family: var(--font-label);
        font-size: 0.7rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #beb2a1;
      }
      .gate-readout > span {
        grid-area: 1 / 1;
        white-space: nowrap;
        transition: opacity 0.4s;
      }
      .gate-readout > .is-off {
        opacity: 0;
      }
      /* A load error is a sentence, so it wraps. */
      .gate-readout.has-error {
        height: auto;
        line-height: 1.2rem;
      }
      .gate-readout.has-error > span {
        white-space: normal;
      }
      .gate-readout b {
        margin-left: 0.5rem;
        font: italic 400 1.5rem/1 var(--font-display);
        letter-spacing: 0;
        vertical-align: -0.2rem;
        color: #ffd27a;
      }
      /* The count is a drum of the numbers 0 to 100 behind a window one number high. The gate
         meter rolls the drum with a transform, so the count runs on while the main thread is
         busy. Each number sits in a row 1.5em high, so the italic digits of the next number
         stay out of the window. With rows 1em high, Firefox showed a sliver of them. */
      .gate-count {
        display: inline-block;
        width: 1.7em;
        height: 1.5em;
        margin-block: -0.25em;
        padding-right: 0.08em;
        overflow: hidden;
        text-align: right;
        vertical-align: top;
        -webkit-mask: linear-gradient(transparent, #000 16% 84%, transparent);
        mask: linear-gradient(transparent, #000 16% 84%, transparent);
      }
      .gate-drum {
        display: block;
      }
      .gate-count i {
        display: block;
        height: 1.5em;
        line-height: 1.5em;
        font-style: inherit;
      }
      /* The way in is a pane of night glass in a brass ring with two 12px chamfers
         (docs/design-system.md, The frame). The ring is a mask: the outer shape minus an inset
         copy of it. The hard-stop gradients only cut the chamfers. */
      .gate-enter {
        --chamfer: linear-gradient(135deg, #0000 8.49px, #000 0 calc(100% - 8.49px), #0000 0);
        position: relative;
        isolation: isolate;
        display: inline-flex;
        align-items: center;
        gap: 0.8rem;
        padding: 0.95rem 1.7rem;
        border: 0;
        background: none;
        font-family: var(--font-label);
        font-size: 0.78rem;
        font-weight: 500;
        line-height: 1rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #fcc96a;
        cursor: pointer;
        transition: color 0.2s;
      }
      .gate-enter::before,
      .gate-enter::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
      }
      .gate-enter::before {
        background: #0e142ad6;
        -webkit-mask: var(--chamfer);
        mask: var(--chamfer);
      }
      .gate-enter::after {
        padding: 1px;
        background: #c9a46ab3;
        -webkit-mask: linear-gradient(135deg, #0000 8.07px, #000 0 calc(100% - 8.07px), #0000 0) content-box, var(--chamfer);
        -webkit-mask-composite: xor;
        mask: linear-gradient(135deg, #0000 8.07px, #000 0 calc(100% - 8.07px), #0000 0) content-box, var(--chamfer);
        mask-composite: exclude;
      }
      .gate-enter svg {
        width: 1rem;
        animation: gate-nudge 1.6s ease-in-out infinite;
      }
      .gate-enter:hover,
      .gate-enter:focus-visible {
        color: #fff3d2;
      }
      .gate-enter:hover::after,
      .gate-enter:focus-visible::after {
        background: #fbb13c;
      }
      .gate-enter:focus-visible {
        outline: 2px solid #fcc96a;
        outline-offset: 4px;
      }
      .gate-enter:disabled,
      .gate-enter:disabled + .gate-hint {
        visibility: hidden;
      }
      .gate-hint {
        font-family: var(--font-label);
        font-size: 0.62rem;
        line-height: 1rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;

      }
      /* The way in shows with the lit line, at once. */
      .gate.is-ready .gate-enter,

      }
      @keyframes gate-in {
        from { opacity: 0; transform: translateY(8px); }

      }

        }
      }
      @media (pointer: coarse) {

        }
      }
      @media (prefers-reduced-motion: reduce) {
        .gate * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>

    <!-- The gate shows on a first visit to the home page. On any other page the art waits,
         hidden and not downloaded, for the nav lantern, and Name.vue calls load() then. Each
         set of layers fades in once all its files have decoded, so the picture sharpens in
         one step and no layer decodes on the main thread when the lamp first lights.
         The first paint already shows the whole picture, soft, so the sharp files wait for
         the shell bundle: src/main.js calls load() first thing. On a live slow 3G line the
         files shared the line with the bundle from the start, and the gate text came at
         11.8 s. The sets load one after the other, so the unlit set gets the line first. A
         bundle that never runs still gets the sharp art after LATE_MS. -->
    <script>
      const art = document.getElementById('gate-art')
      let loading = null
      art.load = () => {
        const set = (names, flag) =>
          Promise.all(names.map((name) => {
            const image = new Image()
            image.src = '/gate/' + name + '.webp'
            return image.decode()
          })).then(() => art.classList.add(flag), () => art.classList.add(flag))
        loading ??= set(['branch-s0', 'lantern-s0'], 'is-sharp')
          .then(() => set(['lantern-s1'], 'is-lamp'))
          .then(() => Promise.all([set(['branch-s1'], 'is-autumn'), set(['sprites-s1'], 'has-leaves')]))
        return loading
      }
      const LATE_MS = 12000
      if (location.pathname === '/') setTimeout(art.load, LATE_MS)
      else art.hidden = true
    </script>
