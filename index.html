    <title>Jovian Lim</title>
    <!--
      The gate: a paper lantern on an autumn branch under the night sky. It lives here, not in
      the app bundle, so it paints before the JS arrives and costs nothing against the shell
      budgets. src/components/Name.vue drives it: it sets --p to the real load share, opens it
      as an iris onto the island when the scene is ready, and removes it after the visitor
      goes in. Colours are hex, because the token CSS loads with the bundle.
    -->
    <style>
      #gate-art {
        --p: 0;
        position: fixed;
        inset: 0;
        z-index: 59;
        overflow: hidden;
        background:
          radial-gradient(120% 60% at 50% 108%, #3a2a5a 0, #23234a 30%, transparent 62%),
          radial-gradient(80% 50% at 82% 8%, #10244a, transparent 70%),
          linear-gradient(#020812, #071330 45%, #141a3c 78%, #2a2148);
      }
      #gate-art.is-ready {
        -webkit-mask: radial-gradient(circle at var(--x) var(--y), transparent var(--hole), #000 calc(var(--hole) + 7rem));
        mask: radial-gradient(circle at var(--x) var(--y), transparent var(--hole), #000 calc(var(--hole) + 7rem));
      }
      #gate-art > * {
        position: absolute;
      }
      .ga-star {
        left: 0;
        top: 0;
        width: 2px;
        height: 2px;
        border-radius: 50%;
        animation: ga-twinkle 4s ease-in-out infinite;
      }
      .ga-star.b {
        animation-delay: -2s;
      }
      .ga-star.far {
        width: 1px;
        height: 1px;
        animation: none;
      }
      .ga-moon {
        right: 13%;
        top: 11%;
        width: 3.2rem;
        height: 3.2rem;
        border-radius: 50%;
        background: radial-gradient(circle at 38% 38%, #f6fbff, #d8ebfb 55%, #a9c3dd);
        box-shadow: 0 0 2rem 0.6rem #d8ebfb40, 0 0 8rem 3rem #8fb6e01c;
      }
      .ga-sky {
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .ga-clouds {
        animation: ga-drift 60s linear infinite alternate;
      }
      .ga-islets {
        animation: ga-bob 9s ease-in-out infinite alternate;
      }
      .ga-lamp {
        left: 50%;
        top: 60%;
        width: min(40rem, 112vw);
        transform: translate(-50%, -50%);
        overflow: visible;
      }
      .ga-glow {
        opacity: var(--p);
      }
      .ga-flicker {
        transform-box: fill-box;
        transform-origin: center;
        animation: ga-glow 3.1s ease-in-out infinite;
      }
      .ga-dim {
        opacity: calc(0.82 - 0.82 * var(--p));
      }
      .ga-hot {
        opacity: calc(1.1 * var(--p));
      }
      .ga-flame {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        transform: scale(calc(0.4 + 0.6 * var(--p)));
        animation: ga-flame 1.3s ease-in-out infinite alternate;
      }
      .ga-spill {
        opacity: calc(0.9 * var(--p));
        mix-blend-mode: screen;
      }
      .ga-sway {
        animation: ga-sway var(--sd) ease-in-out var(--dl) infinite alternate;
      }
      .ga-autumn {
        opacity: clamp(0, (var(--p) - var(--t)) * 14, 1);
        transition: opacity 0.6s;
      }
      .ga-vein {
        fill: none;
        stroke: #2a0e08;
        stroke-opacity: 0.35;
      }
      .ga-swing {
        transform-origin: 300px 64px;
        animation: ga-swing 6s ease-in-out infinite alternate;
      }
      .is-ready .ga-fall {
        animation: ga-fall 3.4s cubic-bezier(0.4, 0, 0.7, 1) var(--fd) forwards;
      }
      .is-ready .ga-fades {
        opacity: 0;
        transition: opacity 1.2s 0.6s;
      }
      @keyframes ga-twinkle {
        50% { opacity: 0.25; }
      }
      @keyframes ga-drift {
        to { transform: translateX(-4%); }
      }
      @keyframes ga-bob {
        to { transform: translateY(-6px); }
      }
      @keyframes ga-glow {
        30% { opacity: 0.86; transform: scale(0.985); }
        80% { opacity: 0.92; transform: scale(1.01); }
      }
      @keyframes ga-flame {
        33% { transform: scale(calc(0.38 + 0.6 * var(--p)), calc(0.44 + 0.6 * var(--p))) skewX(-3deg); }
        100% { transform: scale(calc(0.42 + 0.6 * var(--p)), calc(0.39 + 0.6 * var(--p))) skewX(3deg); }
      }
      @keyframes ga-sway {
        from { transform: rotate(-4deg); }
        to { transform: rotate(5deg); }
      }
      @keyframes ga-swing {
        from { transform: rotate(-1.6deg); }
        to { transform: rotate(1.6deg); }
      }
      @keyframes ga-fall {
        40% { transform: translate(30px, 160px) rotate(140deg); }
        100% { transform: translate(-20px, 560px) rotate(300deg); opacity: 0; }
      }
      @media (max-aspect-ratio: 1/1) {
        .ga-moon {
          right: 10%;
          top: 9%;
          width: 2.4rem;
          height: 2.4rem;
        }
        .ga-lamp {
          top: 54%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #gate-art * {
          animation: none !important;
        }
        .is-ready .ga-fall {
          opacity: 0;
          transition: opacity 0.6s;
        }
      }
      /* The gate dialog from Name.vue: a title screen lit from below by the lantern. */
      .gate {
        --p: 0;
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: clamp(2.5rem, 9vh, 5.5rem) 1.5rem clamp(2rem, 7vh, 4rem);
        text-align: center;
      }
      .gate::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(#020812cc, transparent 32% 64%, #020812dd);
        pointer-events: none;
      }
      .gate > * {
        position: relative;
      }
      .gate-title {
        transform-origin: 50% 0;
        transition: transform 1.6s cubic-bezier(0.6, 0, 0.3, 1);
        animation: gate-in 1.2s 0.1s backwards;
      }
      .gate-eyebrow,
      .gate-role {
        display: block;
        font-family: var(--font-label);
        font-size: 0.72rem;
        text-transform: uppercase;
      }
      .gate-eyebrow {
        padding-left: 0.42em;
        letter-spacing: 0.42em;
        color: #e8c089;
      }
      .gate-name {
        display: block;
        margin-top: 0.5rem;
        font-family: var(--font-display);
        font-size: clamp(4.2rem, 8vw, 7rem);
        font-weight: 400;
        line-height: 0.9;
        /* Room for the J tail, which the text clip would cut. */
        padding: 0 0.15em 0.1em;
        background: radial-gradient(60% 120% at 50% 130%, #fff3d2 0, #ffd27a calc(18% + 22% * var(--p)), #c98a3e 75%, #7a5a3a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 calc(1.4rem * var(--p)) #ff9f4366);
      }
      .gate-role {
        margin-top: 0.9rem;
        padding-left: 0.3em;
        letter-spacing: 0.3em;
        color: #beb2a1;
      }
      .gate-role::after {
        content: '';
        display: block;
        width: 3rem;
        height: 1px;
        margin: 1rem auto 0;
        background: linear-gradient(90deg, transparent, #e8c08999, transparent);
      }
      .gate-foot {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.1rem;
      }
      .gate-readout {
        max-width: 22rem;
        min-height: 1.6rem;
        font-family: var(--font-label);
        font-size: 0.7rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #beb2a1;
      }
      .gate-readout b {
        margin-left: 0.5rem;
        font: italic 400 1.5rem/1 var(--font-display);
        letter-spacing: 0;
        vertical-align: -0.2rem;
        color: #ffd27a;
      }
      .gate-enter {
        display: inline-flex;
        align-items: center;
        gap: 0.8rem;
        padding: 0.95rem 1.7rem;
        border: 1px solid #ffd27a55;
        border-radius: 999px;
        background: linear-gradient(#ffb54d22, #ff7a3a10);
        box-shadow: 0 0 2.5rem #ff9f4333, inset 0 1px 0 #fff3d222;
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
        font-family: var(--font-label);
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #fff3d2;
        cursor: pointer;
      }
      .gate-enter svg {
        width: 1rem;
        animation: gate-nudge 1.6s ease-in-out infinite;
      }
      .gate-enter:hover,
      .gate-enter:focus-visible {
        border-color: #ffd27aaa;
        box-shadow: 0 0 3rem #ff9f4355, inset 0 1px 0 #fff3d244;
      }
      .gate-enter:focus-visible {
        outline: 2px solid #14b8a6;
        outline-offset: 4px;
      }
      .gate-enter:disabled,
      .gate-enter:disabled + .gate-hint {
        visibility: hidden;
      }
      .gate-hint {
        font-family: var(--font-label);
        font-size: 0.62rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #918473;
      }
      .gate.is-ready .gate-enter,
      .gate.is-ready .gate-hint {
        animation: gate-in 0.9s 0.9s backwards;
      }
      @keyframes gate-in {
        from { opacity: 0; transform: translateY(8px); }
      }
      @keyframes gate-nudge {
        50% { transform: translateY(3px); }
      }
      @media (min-aspect-ratio: 1/1) {
        .gate.is-ready .gate-title {
          transform: translateY(-1.5rem) scale(0.78);
        }
      }
      @media (pointer: coarse) {
        .gate-hint {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .gate * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
